<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e0f2fe" />
    <title>Smart Study Planner — Ngoại tuyến</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f0f9ff;
        color: #172554;
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        background: white;
        border: 1px solid #bae6fd;
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 16px 50px rgba(14, 116, 144, 0.12);
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.6;
        margin: 0 0 20px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #047857;
        color: white;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bạn đang ngoại tuyến</h1>
      <p>
        Ứng dụng vẫn giữ dữ liệu đã lưu trên thiết bị. Hãy kết nối mạng rồi tải lại để đồng bộ nội
        dung mới và Web Push.
      </p>
      <button onclick="location.reload()">Thử tải lại</button>
    </main>
  </body>
</html>
