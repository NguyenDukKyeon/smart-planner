name: Apply P0B catalog rollback window

"on":
  push:
    branches:
      - improve/p0b-schedule-transactions

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p0b-catalog-rollback-window]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
          fetch-depth: 0
      - name: Allow exactly one verified catalog rollback write
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  const pushAutoSyncAttemptedRef = useRef(false);\n",
                  "  const pushAutoSyncAttemptedRef = useRef(false);\n  const catalogRollbackPendingRef = useRef(false);\n",
              ),
              (
                  '''  const persistScheduleSubjects = useCallback(
    (nextSubjects: Subject[]): StorageWriteResult => {
      if (storageBlocked) {
        return {
          ok: false,
          error: "Không thể thay đổi danh mục khi bộ nhớ cần được khôi phục.",
        };
      }
      const saved = saveStoredCustomSubjects(nextSubjects);
      if (!saved.ok) {
        setSubjectStorageStatus({ status: "unavailable", error: saved.error });
        return saved;
      }
      setSubjectStorageStatus({ status: "ok", value: nextSubjects });
      return saved;
    },
    [storageBlocked],
  );
''',
                  '''  const persistScheduleSubjects = useCallback(
    (nextSubjects: Subject[]): StorageWriteResult => {
      const isRollbackAttempt = catalogRollbackPendingRef.current;
      if (storageBlocked && !isRollbackAttempt) {
        return {
          ok: false,
          error: "Không thể thay đổi danh mục khi bộ nhớ cần được khôi phục.",
        };
      }

      const saved = saveStoredCustomSubjects(nextSubjects);
      if (!saved.ok) {
        catalogRollbackPendingRef.current = !isRollbackAttempt;
        setSubjectStorageStatus({ status: "unavailable", error: saved.error });
        return saved;
      }

      catalogRollbackPendingRef.current = false;
      setSubjectStorageStatus({ status: "ok", value: nextSubjects });
      return saved;
    },
    [storageBlocked],
  );
''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one marker, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p0b-catalog-rollback-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/p0b-catalog-rollback-window.yml
          git diff --cached --check
          git commit -m "fix: allow one verified catalog rollback [p0b-catalog-rollback-window]"
          git push origin HEAD:improve/p0b-schedule-transactions
