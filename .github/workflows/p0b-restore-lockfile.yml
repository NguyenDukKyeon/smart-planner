name: Restore P0B lockfile

"on":
  push:
    branches:
      - improve/p0b-schedule-transactions

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p0b-restore-lock]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
          fetch-depth: 0
      - name: Restore canonical lockfile
        run: |
          git checkout 851cb141b7f07d372c48fd0e946bca4d03adb36a -- package-lock.json
          rm .github/workflows/p0b-restore-lockfile.yml
      - name: Commit restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore canonical package lock [p0b-restore-lock]"
          git push origin HEAD:improve/p0b-schedule-transactions
