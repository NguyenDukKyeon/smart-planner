name: P0B fail closed catalog storage

on:
  push:
    branches:
      - improve/p0b-schedule-transactions
    paths:
      - .github/workflows/p0b-fix-catalog-storage-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
      - name: Update persist-only catalog status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          source = path.read_text()
          old = "\n".join([
              "  const persistScheduleSubjects = useCallback(",
              "    (nextSubjects: Subject[]): StorageWriteResult => {",
              "      if (storageBlocked) {",
              "        return {",
              "          ok: false,",
              '          error: "Không thể thay đổi danh mục khi bộ nhớ cần được khôi phục.",',
              "        };",
              "      }",
              "      return saveStoredCustomSubjects(nextSubjects);",
              "    },",
              "    [storageBlocked],",
              "  );",
          ])
          new = "\n".join([
              "  const persistScheduleSubjects = useCallback(",
              "    (nextSubjects: Subject[]): StorageWriteResult => {",
              "      if (storageBlocked) {",
              "        return {",
              "          ok: false,",
              '          error: "Không thể thay đổi danh mục khi bộ nhớ cần được khôi phục.",',
              "        };",
              "      }",
              "      const saved = saveStoredCustomSubjects(nextSubjects);",
              "      if (!saved.ok) {",
              '        setSubjectStorageStatus({ status: "unavailable", error: saved.error });',
              "        return saved;",
              "      }",
              '      setSubjectStorageStatus({ status: "ok", value: nextSubjects });',
              "      return saved;",
              "    },",
              "    [storageBlocked],",
              "  );",
          ])
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one catalog persistence block, found {count}")
          path.write_text(source.replace(old, new))
          PY
          grep -F 'const saved = saveStoredCustomSubjects(nextSubjects);' src/routes/index.tsx
          grep -F 'setSubjectStorageStatus({ status: "unavailable", error: saved.error });' src/routes/index.tsx
          grep -F 'setSubjectStorageStatus({ status: "ok", value: nextSubjects });' src/routes/index.tsx
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p0b-fix-catalog-storage-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/p0b-fix-catalog-storage-status.yml
          git diff --cached --check
          git commit -m "fix: fail closed on catalog storage errors"
          git push origin HEAD:improve/p0b-schedule-transactions
