name: Apply P0B planner settings rollback window

"on":
  push:
    branches:
      - improve/p0b-schedule-transactions

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p0b-planner-rollback-window]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
          fetch-depth: 0
      - name: Allow exactly one verified rollback write
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/lib/progress-store.ts")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "  const stateRef = useRef(state);\n  const persistenceEnabled = useRef(false);\n",
                  "  const stateRef = useRef(state);\n  const persistenceEnabled = useRef(false);\n  const plannerSettingsRollbackPendingRef = useRef(false);\n",
              ),
              (
                  "  const persistPlannerSettings = useCallback(\n    (plannerSettings: PlannerSettings): StorageWriteResult => {\n      if (!persistenceEnabled.current) {\n        const error = \"Bộ nhớ trình duyệt chưa sẵn sàng; thay đổi chưa được áp dụng.\";\n        setStorageError(error);\n        return { ok: false, error };\n      }\n\n      const saved = savePlannerSettingsStorage(stateRef.current, plannerSettings);\n      if (!saved.ok) {\n        persistenceEnabled.current = false;\n        setStorageStatus({ status: \"unavailable\", error: saved.error });\n        setStorageError(saved.error);\n      }\n      return saved;\n    },\n    [],\n  );\n",
                  "  const persistPlannerSettings = useCallback(\n    (plannerSettings: PlannerSettings): StorageWriteResult => {\n      const isRollbackAttempt = plannerSettingsRollbackPendingRef.current;\n      if (!persistenceEnabled.current && !isRollbackAttempt) {\n        const error = \"Bộ nhớ trình duyệt chưa sẵn sàng; thay đổi chưa được áp dụng.\";\n        setStorageError(error);\n        return { ok: false, error };\n      }\n\n      const saved = savePlannerSettingsStorage(stateRef.current, plannerSettings);\n      if (!saved.ok) {\n        plannerSettingsRollbackPendingRef.current = !isRollbackAttempt;\n        persistenceEnabled.current = false;\n        setStorageStatus({ status: \"unavailable\", error: saved.error });\n        setStorageError(saved.error);\n        return saved;\n      }\n\n      plannerSettingsRollbackPendingRef.current = false;\n      persistenceEnabled.current = true;\n      setStorageStatus({ status: \"ok\", value: stateRef.current });\n      setStorageError(null);\n      return saved;\n    },\n    [],\n  );\n",
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one marker, found {source.count(old)}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p0b-planner-settings-rollback-window.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/progress-store.ts .github/workflows/p0b-planner-settings-rollback-window.yml
          git commit -m "fix: allow one verified planner settings rollback [p0b-planner-rollback-window]"
          git push origin HEAD:improve/p0b-schedule-transactions
