name: Build diagnostics

"on":
  push:
    branches:
      - main
      - improve/p0a-hours-build-purity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Apply reviewed study-day fix
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/improve/p0a-hours-build-purity' }}"
        run: |
          echo '' | base64 -d > /tmp/patch-index.py
          python /tmp/patch-index.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: base streak on the original daily queue"
            git push origin HEAD:improve/p0a-hours-build-purity
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify commands did not modify tracked source
        run: git diff --exit-code
