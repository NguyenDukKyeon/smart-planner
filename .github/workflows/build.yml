name: Build diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Materialize accepted generated source
        run: npm run build
      - name: Capture generated source
        uses: actions/upload-artifact@v4
        with:
          name: p0a-generated-source
          path: |
            src/lib/planner.ts
            src/lib/mock-data.ts
            src/lib/custom-subjects.ts
            src/routes/index.tsx
            src/components/LearningRoadmap.tsx
            src/components/TodayPanel.tsx
            src/components/StudyStreakCard.tsx
            src/components/AddLessonModal.tsx
            src/components/CourseManagerModal.tsx
            src/components/FlexiblePlanner.tsx
          if-no-files-found: error
      - run: npx vitest run src/lib/build-purity-regression.test.ts
