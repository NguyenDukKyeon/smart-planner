name: Build diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Capture exact lint diagnostics
        run: |
          set +e
          npx eslint . -f json > lint-report-full.json
          status=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("lint-report-full.json", "utf8"));
          const compact = report
            .filter((entry) => entry.errorCount > 0 || entry.warningCount > 0)
            .map((entry) => ({
              filePath: entry.filePath.replace(`${process.cwd()}/`, ""),
              errorCount: entry.errorCount,
              warningCount: entry.warningCount,
              messages: entry.messages.map(({ ruleId, severity, message, line, column, endLine, endColumn }) => ({
                ruleId,
                severity,
                message,
                line,
                column,
                endLine,
                endColumn,
              })),
            }));
          fs.writeFileSync("lint-report.json", `${JSON.stringify(compact, null, 2)}\n`);
          NODE
          rm lint-report-full.json
          echo "eslint_exit=$status"
      - name: Commit lint report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint-report.json
          git commit -m "chore: capture P0A lint diagnostics [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
