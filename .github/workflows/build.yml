name: Build diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format committed TypeScript source
        run: npx prettier --write "src/**/*.{ts,tsx}" eslint.config.js
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src eslint.config.js
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style: format committed application source [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
