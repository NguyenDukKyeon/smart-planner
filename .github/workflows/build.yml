name: Build diagnostics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Integrate daily-hour policy into progress state
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          function patchProgressStore() {
            const path = "src/lib/progress-store.ts";
            let source = fs.readFileSync(path, "utf8");

            function replaceText(before, after, label) {
              if (source.includes(after)) return;
              if (!source.includes(before)) throw new Error(`Missing ${label}`);
              source = source.replace(before, after);
            }

            function replacePattern(pattern, after, marker, label) {
              if (source.includes(marker)) return;
              if (!pattern.test(source)) throw new Error(`Missing ${label}`);
              source = source.replace(pattern, after);
            }

            replaceText(
              'import { addDaysISO, isDateISO, todayISO } from "./date-utils";',
              'import { addDaysISO, isDateISO, todayISO } from "./date-utils";\nimport { normalizeDailyStudyHours } from "./study-hours";',
              "study-hours import",
            );

            replacePattern(
              /  const psIn = \(parsed\.plannerSettings as Partial<PlannerSettings>\) \?\? \{\};\n  const plannerSettings: PlannerSettings = \{\n[\s\S]*?    reviewShareMax:/,
              `  const psIn = (parsed.plannerSettings as Partial<PlannerSettings>) ?? {};
              const storedDefaultDailyHours = normalizeStoredDailyHours(
                psIn.defaultDailyHours,
                DEFAULT_PLANNER_SETTINGS.defaultDailyHours,
              );
              const plannerSettings: PlannerSettings = {
                todayHours: normalizeStoredDailyHours(psIn.todayHours, storedDefaultDailyHours),
                dailyHours:
                  psIn.dailyHours && typeof psIn.dailyHours === "object"
                    ? sanitizeDailyHours(psIn.dailyHours)
                    : {},
                defaultDailyHours: storedDefaultDailyHours,
                reviewShareMax:`,
              "storedDefaultDailyHours",
              "planner settings migration",
            );

            replacePattern(
              /function sanitizeDailyHours\(raw: Record<string, unknown>\): Record<string, number> \{[\s\S]*?\n\}/,
              `function normalizeStoredDailyHours(value: unknown, fallback: number): number {
              if (typeof value !== "number" || !Number.isFinite(value)) {
                return normalizeDailyStudyHours(fallback);
              }
              return normalizeDailyStudyHours(value);
            }

            function sanitizeDailyHours(raw: Record<string, unknown>): Record<string, number> {
              const out: Record<string, number> = {};
              for (const [dateISO, value] of Object.entries(raw)) {
                if (typeof value !== "number" || !Number.isFinite(value)) continue;
                out[dateISO] = normalizeDailyStudyHours(value);
              }
              return out;
            }`,
              "normalizeStoredDailyHours(value: unknown",
              "daily hour sanitizer",
            );

            replaceText(
              "export function useProgress() {",
              `export function setTodayHoursState(
              state: ProgressState,
              hours: number,
              dateISO = todayISO(),
            ): ProgressState {
              const normalized = normalizeDailyStudyHours(hours);
              return {
                ...state,
                plannerSettings: {
                  ...state.plannerSettings,
                  todayHours: normalized,
                  dailyHours: { ...state.plannerSettings.dailyHours, [dateISO]: normalized },
                },
              };
            }

            export function setDayHoursState(
              state: ProgressState,
              dateISO: string,
              hours: number | null,
              todayDateISO = todayISO(),
            ): ProgressState {
              const dailyHours = { ...state.plannerSettings.dailyHours };
              if (hours == null) delete dailyHours[dateISO];
              else dailyHours[dateISO] = normalizeDailyStudyHours(hours);

              return {
                ...state,
                plannerSettings: {
                  ...state.plannerSettings,
                  todayHours:
                    dateISO === todayDateISO
                      ? hours == null
                        ? state.plannerSettings.defaultDailyHours
                        : normalizeDailyStudyHours(hours)
                      : state.plannerSettings.todayHours,
                  dailyHours,
                },
              };
            }

            export function setDefaultDailyHoursState(
              state: ProgressState,
              hours: number,
            ): ProgressState {
              return {
                ...state,
                plannerSettings: {
                  ...state.plannerSettings,
                  defaultDailyHours: normalizeDailyStudyHours(hours),
                },
              };
            }

            export function useProgress() {`,
              "pure study hour mutations",
            );

            replacePattern(
              /  const setTodayHours = useCallback\([\s\S]*?  const addStudySession = useCallback\(/,
              `  const setTodayHours = useCallback(
                (hours: number) => commit((state) => setTodayHoursState(state, hours)),
                [commit],
              );

              const setDayHours = useCallback(
                (dateISO: string, hours: number | null) =>
                  commit((state) => setDayHoursState(state, dateISO, hours)),
                [commit],
              );

              const setDefaultDailyHours = useCallback(
                (hours: number) => commit((state) => setDefaultDailyHoursState(state, hours)),
                [commit],
              );

              const addStudySession = useCallback(`,
              "setTodayHoursState(state, hours)",
              "progress hour setters",
            );

            fs.writeFileSync(path, source);
          }

          function patchScheduleModeTypes() {
            const path = "src/lib/custom-subjects.ts";
            let source = fs.readFileSync(path, "utf8");

            source = source.replace(
              'scheduleMode: lesson.scheduleMode === "fixed" ? "fixed" : "flexible",',
              'scheduleMode: (lesson.scheduleMode === "fixed" ? "fixed" : "flexible") as LessonScheduleMode,',
            );

            const oldSignature = 'patch: Partial<Pick<Lesson, "plannedDurationMinutes" | "scheduledDate">>,';
            const newSignature = 'patch: Partial<Pick<Lesson, "plannedDurationMinutes" | "scheduledDate" | "scheduleMode">>,';
            if (!source.includes(newSignature)) {
              if (!source.includes(oldSignature)) throw new Error("Missing bulk lesson patch signature");
              source = source.replace(oldSignature, newSignature);
            }

            const oldReturn = `          scheduledDate,
                      weekday: scheduledDate ? weekdayFullVi(scheduledDate) : "",`;
            const newReturn = `          scheduledDate,
                      scheduleMode:
                        patch.scheduleMode === "fixed" || patch.scheduleMode === "flexible"
                          ? patch.scheduleMode
                          : lesson.scheduleMode ?? "flexible",
                      weekday: scheduledDate ? weekdayFullVi(scheduledDate) : "",`;
            if (!source.includes("patch.scheduleMode === \"fixed\" || patch.scheduleMode === \"flexible\"")) {
              if (!source.includes(oldReturn)) throw new Error("Missing bulk lesson return block");
              source = source.replace(oldReturn, newReturn);
            }

            fs.writeFileSync(path, source);
          }

          patchProgressStore();
          patchScheduleModeTypes();
          NODE
      - name: Verify progress study-hour integration
        run: npx vitest run src/lib/study-hours.test.ts src/lib/progress-study-hours.test.ts src/lib/schedule-mode-regression.test.ts
      - run: npx tsc --noEmit
      - name: Commit progress integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/progress-store.ts src/lib/custom-subjects.ts
          git commit -m "feat: persist study capacity through sixteen hours [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
