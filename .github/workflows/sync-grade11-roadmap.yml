name: Sync grade 11 sample roadmap

on:
  push:
    branches: [main]
    paths:
      - scripts/sync-grade11-roadmap-and-study-streak.mjs
      - .github/workflows/sync-grade11-roadmap.yml
      - public/mau_import_bai_hoc_lop_11_KNTT_120_phut.xlsx

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync sample and streak rule
        run: node scripts/sync-grade11-roadmap-and-study-streak.mjs
      - name: Validate generated application
        run: |
          npm run typecheck
          npm run build
      - name: Commit generated app changes
        run: |
          if git diff --quiet -- src/data/grade11-roadmap.json src/lib/mock-data.ts src/lib/custom-subjects.ts src/lib/progress-analytics.ts src/routes/index.tsx src/components/TodayPanel.tsx src/components/StudyStreakCard.tsx; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/grade11-roadmap.json src/lib/mock-data.ts src/lib/custom-subjects.ts src/lib/progress-analytics.ts src/routes/index.tsx src/components/TodayPanel.tsx src/components/StudyStreakCard.tsx
          git commit -m "Sync grade 11 sample roadmap and strict study streak"
          git push
