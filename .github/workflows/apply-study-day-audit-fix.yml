name: Apply reviewed study-day fix

on:
  push:
    branches: [improve/p0a-hours-build-purity]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0a-hours-build-purity
          submodules: false
      - name: Patch Dashboard marker logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/index.tsx")
          source = path.read_text()

          source = source.replace(
              'import { buildShiftedSchedule, pickTodayQueue } from "@/lib/planner";',
              'import { buildShiftedSchedule } from "@/lib/planner";\nimport { isStudyDayQueueComplete } from "@/lib/study-day-completion";',
          )

          start_marker = "  const todayStudyDayComplete = useMemo<boolean | null>(() => {"
          end_marker = "  const realStudyStreak = useMemo(() => computeStudyStreak(state), [state]);"
          start = source.index(start_marker)
          end = source.index(end_marker)

          replacement = '''  const todayStudyDayComplete = useMemo<boolean | null>(() => {
            if (!hydrated || !workspaceStorageLoaded || subjects.length === 0) return null;
            return isStudyDayQueueComplete({
              subjects,
              completed: state.completedLessons,
              reviewCompletions: state.reviewCompletions,
              meta: state.studyMeta,
              settings: state.plannerSettings,
              dateISO: todayISO(),
            });
          }, [
            hydrated,
            state.completedLessons,
            state.plannerSettings,
            state.reviewCompletions,
            state.studyMeta,
            subjects,
            workspaceStorageLoaded,
          ]);

          const todayStudyDayRecorded = state.habitLog[todayISO()]?.__study_day_complete__ === true;

          useEffect(() => {
            if (todayStudyDayComplete == null || todayStudyDayRecorded === todayStudyDayComplete) return;
            updateHabit({ __study_day_complete__: todayStudyDayComplete });
          }, [todayStudyDayComplete, todayStudyDayRecorded, updateHabit]);

'''

          path.write_text(source[:start] + replacement + source[end:])
          PY
      - name: Commit reviewed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: base streak on the original daily queue"
          git push origin HEAD:improve/p0a-hours-build-purity
