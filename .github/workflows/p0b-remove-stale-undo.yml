name: P0B remove stale undo state

on:
  push:
    branches:
      - improve/p0b-schedule-transactions
    paths:
      - .github/workflows/p0b-remove-stale-undo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
      - name: Remove obsolete local undo state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/FlexiblePlanner.tsx")
          source = path.read_text()
          stale = "  const [undoStack, setUndoStack] = useState<UndoEntry[]>([]);\n"
          if source.count(stale) != 1:
              raise SystemExit(f"Expected exactly one stale undo declaration, found {source.count(stale)}")
          path.write_text(source.replace(stale, ""))
          PY
          ! grep -F 'UndoEntry' src/components/FlexiblePlanner.tsx
          ! grep -F 'setUndoStack' src/components/FlexiblePlanner.tsx
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p0b-remove-stale-undo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FlexiblePlanner.tsx .github/workflows/p0b-remove-stale-undo.yml
          git diff --cached --check
          git commit -m "fix: remove obsolete Flexible Planner undo state"
          git push origin HEAD:improve/p0b-schedule-transactions
