name: Apply P0B progress hook adapter

"on":
  push:
    branches:
      - improve/p0b-schedule-transactions

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[p0b-progress-hook]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
          fetch-depth: 0
      - name: Patch useProgress schedule boundary
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/lib/progress-store.ts")
          source = path.read_text(encoding="utf-8")

          callbacks = '''  const persistPlannerSettings = useCallback(
            (plannerSettings: PlannerSettings): StorageWriteResult => {
              if (!persistenceEnabled.current) {
                const error = "Bộ nhớ trình duyệt chưa sẵn sàng; thay đổi chưa được áp dụng.";
                setStorageError(error);
                return { ok: false, error };
              }

              const saved = savePlannerSettingsStorage(stateRef.current, plannerSettings);
              if (!saved.ok) {
                persistenceEnabled.current = false;
                setStorageStatus({ status: "unavailable", error: saved.error });
                setStorageError(saved.error);
              }
              return saved;
            },
            [],
          );

          const applyPersistedPlannerSettings = useCallback(
            (plannerSettings: PlannerSettings): boolean => {
              const next = applyPlannerSettingsToProgressState(stateRef.current, plannerSettings);
              stateRef.current = next;
              setState(next);
              setStorageStatus({ status: "ok", value: next });
              setStorageError(null);
              return true;
            },
            [],
          );

          '''

          callback_marker = "  const toggleLesson = useCallback("
          if "const persistPlannerSettings = useCallback(" not in source:
              if callback_marker not in source:
                  raise SystemExit("useProgress callback marker not found")
              source = source.replace(callback_marker, callbacks + callback_marker, 1)

          return_old = '''    setTodayHours,
            setDayHours,
            setDefaultDailyHours,
          '''
          return_new = '''    setTodayHours,
            setDayHours,
            setDefaultDailyHours,
            persistPlannerSettings,
            applyPersistedPlannerSettings,
          '''
          if "    persistPlannerSettings," not in source:
              if return_old not in source:
                  raise SystemExit("useProgress return marker not found")
              source = source.replace(return_old, return_new, 1)

          path.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/p0b-progress-hook-adapter.yml")
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose useProgress schedule boundary [p0b-progress-hook]"
          git push origin HEAD:improve/p0b-schedule-transactions
