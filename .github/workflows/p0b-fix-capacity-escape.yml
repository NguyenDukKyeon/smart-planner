name: P0B fix capacity Escape cancellation

on:
  push:
    branches:
      - improve/p0b-schedule-transactions
    paths:
      - .github/workflows/p0b-fix-capacity-escape.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/p0b-schedule-transactions
      - name: Guard the blur caused by Escape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/FlexiblePlanner.tsx")
          source = path.read_text()

          replacements = [
              (
                  'import { useEffect, useMemo, useState, type DragEvent as ReactDragEvent } from "react";',
                  'import { useEffect, useMemo, useRef, useState, type DragEvent as ReactDragEvent } from "react";',
              ),
              (
                  '  const [draft, setDraft] = useState(String(day.hours));\n',
                  '  const [draft, setDraft] = useState(String(day.hours));\n  const cancelNextBlurCommitRef = useRef(false);\n',
              ),
              (
                  '  const commitDraft = () => {\n    if (draft.trim() === "") {',
                  '  const commitDraft = () => {\n    if (cancelNextBlurCommitRef.current) {\n      cancelNextBlurCommitRef.current = false;\n      return;\n    }\n    if (draft.trim() === "") {',
              ),
              (
                  '          if (event.key === "Escape") {\n            setDraft(String(day.hours));',
                  '          if (event.key === "Escape") {\n            cancelNextBlurCommitRef.current = true;\n            setDraft(String(day.hours));',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch target, found {count}: {old[:80]}")
              source = source.replace(old, new)

          path.write_text(source)
          PY
          grep -F 'cancelNextBlurCommitRef.current = true' src/components/FlexiblePlanner.tsx
          grep -F 'cancelNextBlurCommitRef.current = false' src/components/FlexiblePlanner.tsx
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/p0b-fix-capacity-escape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FlexiblePlanner.tsx .github/workflows/p0b-fix-capacity-escape.yml
          git diff --cached --check
          git commit -m "fix: cancel capacity edit on Escape"
          git push origin HEAD:improve/p0b-schedule-transactions
